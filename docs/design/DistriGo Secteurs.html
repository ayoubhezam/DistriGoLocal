<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DistriGo Secteurs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: a phone-sized DistriGo app centred on a neutral stage, with a short "parcours" panel beside it (above it on narrow screens).
   The app keeps its own light palette (DistriGo has no dark mode yet); only the stage around it follows the viewer's theme. */
:root{
  --st-bg:#E3E8F4; --st-fg:#16224F; --st-mute:#53607F; --st-card:#F4F6FC; --st-line:#C8D1E6; --st-acc:#172B64; --st-hover:#E9EDF8;
  --navy:#172B64; --navy-press:#0F1E4A; --ink:#1A2B6B; --text:#2A3558; --mute:#636E8D; --faint:#7B86A4;
  --bg:#F5F7FC; --card:#FFFFFF; --line:#E1E6F2; --field:#F5F7FC; --track:#EBEFF8; --press:#F1F4FB;
  --info-bg:#E9EFFC; --info-fg:#2655C8;
  --green-bg:#E4F4EB; --green:#2B9560; --blue-bg:#E5EDFC; --blue:#3566D6; --purple-bg:#ECE7FB; --purple:#7048D2;
  --orange-bg:#FCF0E0; --orange:#C9740F; --red-bg:#FBE8E5; --red:#C8402C;
  --err:#BF3828; --err-bg:#FDEEEC; --snack:#1E2A52;
  --r-card:20px; --r-field:18px; --r-tile:14px; --r-pill:999px;
  --t-fast:150ms; --t-mid:220ms; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --st-bg:#0E1426; --st-fg:#E6EAF8; --st-mute:#9AA6C6; --st-card:#161D35; --st-line:#2A3355; --st-acc:#9DB2FF; --st-hover:#1C2442; color-scheme:dark}}
:root[data-theme="dark"]{
  --st-bg:#0E1426; --st-fg:#E6EAF8; --st-mute:#9AA6C6; --st-card:#161D35; --st-line:#2A3355; --st-acc:#9DB2FF; --st-hover:#1C2442; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--st-bg);color:var(--st-fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #6C8CF0;outline-offset:2px}

/* ───────── Stage + panel ───────── */
.stage{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
.panel{width:290px;min-width:0;background:var(--st-card);border:1px solid var(--st-line);border-radius:20px;padding:6px 16px 16px}
.panel summary{list-style:none;cursor:pointer;padding:12px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel summary::-webkit-details-marker{display:none}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--st-mute)}
.panel h2{font-size:18px;font-weight:800;color:var(--st-fg);text-wrap:balance}
.panel .lead{font-size:13.5px;color:var(--st-mute);margin:2px 0 12px}
.sc{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.sc button{width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid var(--st-line);background:transparent;display:block;transition:background var(--t-fast)}
.sc button:hover{background:var(--st-hover)}
.sc b{display:block;font-size:14px;font-weight:700;color:var(--st-fg)}
.sc span{display:block;font-size:12.5px;color:var(--st-mute);margin-top:1px}
.panel .reset{margin-top:12px;width:100%;height:44px;border-radius:14px;border:1px dashed var(--st-line);font-weight:600;font-size:13.5px;color:var(--st-fg)}
.panel .reset:hover{background:var(--st-hover)}
.panel .note{font-size:12.5px;color:var(--st-mute);margin-top:10px}

/* ───────── Device ───────── */
.device{position:relative;width:380px;max-width:100%;height:min(820px,calc(100dvh - 32px));display:flex;flex-direction:column;background:var(--bg);border-radius:34px;overflow:hidden;
  box-shadow:0 0 0 8px #0E1630,0 0 0 9px rgba(255,255,255,.14),0 28px 60px rgba(8,12,34,.38);color:var(--text)}
.sysbar{flex:none;height:30px;display:flex;align-items:center;justify-content:space-between;padding:4px 20px 0;background:#fff;color:#2B3350;font-size:13px;font-weight:600}
.sysbar .r{display:flex;gap:6px;align-items:center}
.sysbar svg{width:16px;height:16px;fill:#2B3350}
.navbar{flex:none;height:44px;background:#fff;display:flex;align-items:center;justify-content:space-around;padding:0 28px}
.navbar button{width:64px;height:36px;display:grid;place-items:center;border-radius:18px;color:#4A5272}
.navbar button:active{background:#EEF1F8}
.navbar button[disabled]{opacity:.55}
.navbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.lg{width:26px;height:26px}

/* App bar */
.appbar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 6px 8px;min-height:64px;background:var(--bg)}
.appbar.noback{padding-left:20px}
.bar-title{flex:1;min-width:0;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.bar-text{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding-left:4px}
.bar-text .bar-title{flex:none;max-width:100%;padding-left:0;line-height:1.25}
.bar-sub{position:relative;display:flex;max-width:100%;margin:1px -8px -2px;padding:2px 8px;border-radius:10px;font-size:16px;line-height:1.35;color:var(--info-fg);text-align:left;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background var(--t-fast)}
.bar-sub::after{content:"";position:absolute;inset:-8px -4px}
.bar-sub .n,.bar-sub .r{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-sub .n{flex:0 1 auto}
.bar-sub .r{flex:0 100 auto;color:var(--mute);white-space:pre}
.bar-sub.pressing{background:var(--info-bg)}
.body>.sec:first-child{margin-top:8px}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--navy);flex:none;transition:background var(--t-fast)}
.iconbtn:active{background:var(--track)}
.iconbtn .ic{width:24px;height:24px;stroke-width:2.2}
.iconbtn.outline{border:1px solid var(--line);background:var(--card)}
.iconbtn.sm{width:44px;height:44px}
.fab{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(23,43,100,.28);transition:background var(--t-fast),transform var(--t-fast)}
.fab:active{background:var(--navy-press);transform:scale(.96)}
.fab .ic{width:26px;height:26px;stroke-width:2.4}

.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px 28px;scrollbar-width:thin}
.body.fwd{animation:inR var(--t-mid) var(--ease)}
.body.back{animation:inL var(--t-mid) var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.footer{flex:none;padding:12px 16px 14px;background:var(--bg);box-shadow:0 -10px 18px -12px rgba(23,43,100,.16);display:flex;gap:10px}
.footer[hidden]{display:none}
.footer .btn{width:auto;flex:1;min-width:0}
.footer .btn.ghost{flex:.85}
.stack{display:flex;flex-direction:column;gap:10px}

/* Cards + rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.rowcard{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:14px 14px 14px 16px;text-align:left;transition:background var(--t-fast)}
.rowcard:active{background:var(--press)}
.rowcard .grow,.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowcard>.ic:last-child{color:#8A94B2;width:20px;height:20px}
.ttl{font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.sub{font-size:13.5px;color:var(--mute);line-height:1.35;overflow-wrap:anywhere}
.sub.faint{color:var(--faint)}
.metas{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px}
.meta{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mute);font-weight:500}
.meta .ic{width:15px;height:15px}
.tile{width:44px;height:44px;border-radius:var(--r-tile);display:grid;place-items:center;flex:none}
.tile.big{width:52px;height:52px;border-radius:16px}.tile.big .ic{width:26px;height:26px}
.tile.xs{width:32px;height:32px;border-radius:11px}.tile.xs .ic{width:18px;height:18px}
.t-green{background:var(--green-bg);color:var(--green)}.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-purple{background:var(--purple-bg);color:var(--purple)}.t-orange{background:var(--orange-bg);color:var(--orange)}.t-red{background:var(--red-bg);color:var(--red)}
.c-green{color:var(--green)}.c-blue{color:var(--blue)}.c-purple{color:var(--purple)}.c-orange{color:var(--orange)}
.avatar{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;letter-spacing:.02em}
.avatar.big{width:60px;height:60px;border-radius:20px;font-size:20px}

.flash{animation:flash 2s ease-out}
@keyframes flash{0%,35%{background:#DCE6FF;border-color:#9DB4F5}100%{background:var(--card);border-color:var(--line)}}

/* Search + chips */
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-field);color:var(--faint);margin-bottom:12px}
.search:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,43,100,.12)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:15.5px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{width:44px;height:44px;display:grid;place-items:center;color:var(--mute);border-radius:50%}
.search .clear[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{position:relative;flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-4px -2px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.count-line{font-size:13px;color:var(--mute);font-weight:500;margin:0 2px 8px}
.grp{position:sticky;top:-6px;z-index:2;background:var(--bg);padding:8px 4px 4px;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--mute)}

/* Section header + buttons */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.sec h2{font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.count{min-width:26px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--track);color:var(--ink);font-size:13px;font-weight:700;display:inline-grid;place-items:center}
.btn{width:100%;height:56px;border-radius:var(--r-field);background:var(--navy);color:#fff;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background var(--t-fast),transform var(--t-fast)}
.btn:active{background:var(--navy-press);transform:scale(.99)}
.btn.ghost{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.btn.ghost:active{background:var(--press)}
.btn.danger{background:var(--red);}
.btn.fit{width:auto;padding:0 20px}
.tonal{position:relative;height:40px;padding:0 14px 0 12px;border-radius:var(--r-pill);background:var(--blue-bg);color:var(--navy);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;flex:none}
.tonal::after{content:"";position:absolute;inset:-4px -2px}
.tonal:active{background:#D5E1FA}
.hint{position:relative}
.hint::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2.5px solid var(--blue);animation:ping 1.5s ease-out infinite;pointer-events:none}
@keyframes ping{0%{opacity:.95;transform:scale(.94)}80%,100%{opacity:0;transform:scale(1.12)}}

/* Header card + stats */
.hdr{padding:16px}
.hdr-top{display:flex;gap:14px;align-items:flex-start}
.hname{font-size:21px;font-weight:800;color:var(--ink);line-height:1.25;overflow-wrap:anywhere;letter-spacing:-.01em}
.hsub{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin-top:3px}
.desc{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--text)}
.linkpill{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 12px;margin-top:8px;border-radius:var(--r-pill);background:var(--green-bg);color:#1E6B43;font-weight:700;font-size:13.5px;max-width:100%}
.linkpill::after{content:"";position:absolute;inset:-6px -2px}
.linkpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-top .iconbtn{margin:-4px -4px 0 0}
.ro{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 16px 8px 18px;border:1px dashed #C7CFE3;border-radius:var(--r-field);background:var(--track);color:var(--ink);font-size:16px;line-height:1.25}
.ro .ic{color:var(--mute);width:20px;height:20px}
.ro small{display:block;font-size:13px;color:var(--mute);margin-top:1px}
.btn:disabled{opacity:.45}
.selrow{position:relative}
.selrow[aria-checked="true"]{border-color:var(--navy);background:#F3F6FF;box-shadow:0 0 0 1px var(--navy)}
.cbx{width:26px;height:26px;border-radius:9px;border:2px solid #AAB3CC;display:grid;place-items:center;flex:none;color:transparent;background:var(--card);transition:background var(--t-fast),border-color var(--t-fast)}
.cbx .ic{width:16px;height:16px;stroke-width:3}
.selrow[aria-checked="true"] .cbx{background:var(--navy);border-color:var(--navy);color:#fff}
.move{font-size:13px;font-weight:600;color:var(--info-fg);display:flex;gap:5px;align-items:center}
.move .ic{width:14px;height:14px}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px 12px}
.empty h3{font-size:17px;font-weight:700;color:var(--ink);margin-top:6px}
.empty p{font-size:14px;color:var(--mute);max-width:260px}
.empty .tonal{margin-top:8px}

/* Forms */
.fld{margin-bottom:18px}
.fld.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld.two>div{min-width:0}
.lbl{display:block;font-size:14px;font-weight:500;color:var(--mute);margin:0 0 6px 2px}
.lbl.strong{color:var(--ink);font-weight:700;font-size:15px}
.req{color:var(--mute)}
.inp{display:block;width:100%;height:56px;padding:0 18px;border:1px solid var(--line);border-radius:var(--r-field);background:var(--card);color:var(--ink);font-size:16px;outline:0;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea.inp{height:auto;min-height:100px;padding:14px 18px;resize:vertical;line-height:1.45}
.inp::placeholder{color:var(--faint)}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,43,100,.12)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:56px;padding:8px 14px 8px 18px;border:1px solid var(--line);border-radius:var(--r-field);background:var(--field);text-align:left;color:var(--faint);font-size:16px;line-height:1.25}
.pick .pv{min-width:0;overflow-wrap:anywhere}
.pick.has{color:var(--ink);background:var(--card)}
.pick .ic{width:22px;height:22px;color:#6E7A9C}
.pick:active{background:var(--press)}
.pick:disabled{opacity:.55}
.is-err{border-color:var(--err)!important;box-shadow:0 0 0 3px rgba(191,56,40,.12)}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--err);font-size:13.5px;line-height:1.35;margin-top:7px;font-weight:500}
.err[hidden]{display:none}
.err .ic{width:16px;height:16px;margin-top:1px}
.help{font-size:13px;color:var(--mute);margin:7px 2px 0;line-height:1.4}
.suggest{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:36px;padding:0 12px;border-radius:var(--r-pill);background:var(--info-bg);color:var(--info-fg);font-size:13.5px;font-weight:600;position:relative}
.suggest::after{content:"";position:absolute;inset:-4px -2px}
.suggest[hidden]{display:none}
.info{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-card);background:var(--info-bg);color:var(--info-fg);font-size:14.5px;line-height:1.4;margin-bottom:16px}
.info .ic{width:20px;height:20px;margin-top:1px}
.seg{display:flex;gap:4px;padding:6px;background:var(--track);border-radius:22px;margin-bottom:18px}
.seg button{flex:1;height:48px;border-radius:16px;color:var(--mute);font-weight:600;font-size:15.5px;transition:background var(--t-fast),color var(--t-fast)}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.reveal{animation:rev var(--t-mid) var(--ease)}
@keyframes rev{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.switchrow{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:18px}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:#C5CCE0;flex:none;transition:background var(--t-fast)}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--t-fast) var(--ease)}
.switch[aria-checked="true"]{background:var(--navy)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switchwrap{position:relative;flex:none}
.switchwrap::after{content:"";position:absolute;inset:-8px}
.gpsbtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);color:var(--navy);font-weight:700;font-size:14px;margin-top:2px}

/* Detail lists */
.kv{display:flex;flex-direction:column}
.kv>*{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;text-align:left;width:100%}
.kv>*+*{border-top:1px solid var(--line)}
.kv .k{font-size:12.5px;color:var(--mute);font-weight:500}
.kv .v{font-size:15.5px;color:var(--ink);font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.kv .v.none{color:var(--faint);font-weight:500}
.kv .ic.lead{color:var(--mute);margin-top:2px}
.kv button.link{align-items:center;min-height:64px}
.kv button.link:active{background:var(--press)}
.kv button.link>.ic:last-child{color:#8A94B2;width:20px;height:20px}
.cardtitle{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:20px 4px 8px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Home (Listes et catégories) */
.lead-text{font-size:16px;color:var(--mute);margin:4px 4px 18px;line-height:1.5}
.h-sec{font-size:22px;font-weight:700;color:var(--ink);margin:20px 4px 10px}
.group{padding:0;overflow:hidden}
.group .rowcard{border-radius:0}

/* Sheet + snackbar */
.layer{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.layer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,16,40,.52);animation:fade var(--t-mid) ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;width:100%;max-height:80%;display:flex;flex-direction:column;background:var(--card);border-radius:28px 28px 0 0;padding:8px 16px 16px;animation:up 240ms var(--ease);outline:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:2px;background:#CBD2E4;margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 6px 4px}
.sheet-head h2{font-size:18px;font-weight:700;color:var(--ink)}
.opts{overflow-y:auto;margin:0 -8px;padding:0 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border-radius:16px;text-align:left}
.opt:active{background:var(--press)}
.opt[aria-selected="true"]{background:var(--info-bg)}
.opt .grow b{font-size:16px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.opt[aria-selected="true"] .grow b{font-weight:700}
.opt .grow span{font-size:13px;color:var(--mute)}
.opt .ic.ok{color:var(--navy);width:22px;height:22px}
.opt.muted .grow b{color:var(--mute);font-weight:500}
.opts-empty{padding:24px 12px;text-align:center;color:var(--mute);font-size:14.5px}
.sheet .search{margin:4px 0 8px;height:48px}
.choices{display:flex;flex-direction:column;gap:10px;padding:4px 0 8px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);text-align:left;transition:background var(--t-fast)}
.choice:active{background:var(--press)}
.choice .ttl{font-size:16px}
.choice>.ic{color:#8A94B2;width:20px;height:20px}
.confirm p{font-size:14.5px;color:var(--mute);margin:2px 4px 16px}
.confirm .btnrow{display:flex;flex-direction:column;gap:10px}
.snack{position:absolute;left:16px;right:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--snack);color:#fff;font-size:14.5px;font-weight:500;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity var(--t-mid),transform var(--t-mid) var(--ease)}
.snack.show{opacity:1;transform:none}
.snack .ic{color:#7BE0A6}

/* Narrow screens: the app fills the width, the system bars are the phone's own */
@media (max-width:719px){
  .stage{gap:16px}
  .panel{width:100%}

@media (prefers-reduced-motion:reduce){

  .hint::after{opacity:.9;animation:none}
}

/* Incremental list: renders in chunks while scrolling, so thousands of rows stay light */
function mountList(el,items,o){
  let i=0,last=null;const chunk=40;
  const more=n=>{let h='';const end=Math.min(items.length,i+n);
    for(;i<end;i++){const it=items[i];
      if(o.group){const g=o.group(it);if(g!==last){h+='<div class="grp" role="presentation">'+esc(g)+'</div>';last=g}}
      h+=o.row(it)}
    el.insertAdjacentHTML('beforeend',h)};
  el.innerHTML='';
  let start=chunk;
  if(o.flashIds&&o.flashIds.length){const k=items.findIndex(x=>o.flashIds.includes(x.id));if(k>=0)start=Math.max(chunk,k+8)}
  more(start);
  S.lister={more:()=>{if(i<items.length)more(chunk)}};
}
bodyEl.addEventListener('scroll',()=>{if(S.lister&&bodyEl.scrollHeight-bodyEl.scrollTop-bodyEl.clientHeight<500)S.lister.more()},{passive:true});

/* ───────── Form helpers ───────── */
function fText(o){
  const id='f-'+o.key;
  const inner=o.area?'<textarea class="inp" id="'+id+'" data-bind="'+o.bind+'" rows="3" placeholder="'+esc(o.ph||'')+'" aria-describedby="e-'+o.key+'">'+esc(o.value||'')+'</textarea>'
    :'<input class="inp" id="'+id+'" data-bind="'+o.bind+'" type="'+(o.type||'text')+'"'+(o.mode?' inputmode="'+o.mode+'"':'')+(o.auto?' autocomplete="'+o.auto+'"':' autocomplete="off"')+' placeholder="'+esc(o.ph||'')+'" value="'+esc(o.value||'')+'" aria-describedby="e-'+o.key+'"'+(o.req?' aria-required="true"':'')+'>';
  return '<div class="fld"><label class="lbl'+(o.strong?' strong':'')+'" for="'+id+'">'+esc(o.label)+(o.req?'<span class="req" aria-hidden="true"> *</span>':'')+'</label>'+inner
    +'<p class="err" id="e-'+o.key+'" role="alert" hidden>'+ic('alert')+'<span></span></p>'+(o.help?'<p class="help">'+esc(o.help)+'</p>':'')+(o.extra||'')+'</div>';
}
function fPick(o){
  const id='f-'+o.key;
  return '<div class="fld'+(o.reveal?' reveal':'')+'"><span class="lbl'+(o.strong?' strong':'')+'" id="l-'+o.key+'">'+esc(o.label)+(o.req?'<span class="req" aria-hidden="true"> *</span>':'')+'</span>'
    +'<button type="button" class="pick'+(o.value?' has':'')+'" id="'+id+'" data-act="pick" data-pick="'+o.key+'" aria-haspopup="dialog" aria-labelledby="l-'+o.key+' '+id+'"'+(o.disabled?' disabled':'')+'><span class="pv">'+esc(o.value||o.ph)+'</span>'+ic('tri')+'</button>'
    +'<p class="err" id="e-'+o.key+'" role="alert" hidden>'+ic('alert')+'<span></span></p>'+(o.help?'<p class="help">'+esc(o.help)+'</p>':'')+'</div>';
}
function setErr(key,msg){
  const p=$('#e-'+key),f=$('#f-'+key);if(!p)return;
  if(msg){$('span',p).textContent=msg;p.hidden=false;f&&f.classList.add('is-err');f&&f.setAttribute('aria-invalid','true')}
  else{p.hidden=true;f&&f.classList.remove('is-err');f&&f.removeAttribute('aria-invalid')}
}
function showErrors(errs,order){
  order.forEach(k=>setErr(k,errs[k]||''));
  const first=order.find(k=>errs[k]);
  if(first){const f=$('#f-'+first);if(f){f.scrollIntoView&&f.scrollIntoView({block:'center'});f.focus({preventScroll:true})}}
  return !first;
}
function renderKeep(){const st=bodyEl.scrollTop;const e=top();bodyEl.innerHTML=screens[e.name].body(e);bodyEl.scrollTop=st;applyHint()}
const snapshot=f=>JSON.stringify(f);
const dirtyFn=e=>e.form&&snapshot(e.form)!==e.form0;

/* ───────── Sheet + pickers ───────── */
function openSheet(html,label){
  S.opener=document.activeElement;
  const layer=$('#layer');
  layer.innerHTML='<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(label)+'" tabindex="-1"><div class="grab"></div>'+html+'</div>';
  layer.hidden=false;S.sheet=true;
  const f=$('#sheet-q')||$('.sheet',layer);f&&f.focus({preventScroll:true});
}
function closeSheet(){
  if(!S.sheet)return;
  $('#layer').hidden=true;$('#layer').innerHTML='';S.sheet=false;S.picker=null;
  if(S.opener&&S.opener.isConnected&&S.opener.focus)S.opener.focus({preventScroll:true});
}
function openPicker(cfg){
  const p={cfg,q:'',list:[]};S.picker=p;
  const html='<div class="sheet-head"><h2>'+esc(cfg.title)+'</h2><button type="button" class="iconbtn sm" data-act="closeSheet" aria-label="Fermer">'+ic('x')+'</button></div>'
    +(cfg.search?'<div class="search" role="search">'+ic('search')+'<input id="sheet-q" type="search" autocomplete="off" placeholder="Rechercher" aria-label="Rechercher"></div>':'')
    +'<div class="opts" id="opts" role="listbox" aria-label="'+esc(cfg.title)+'"></div>';
  openSheet(html,cfg.title);
  p.draw=()=>{
    const t=tokens(p.q);
    const list=[];
    if(cfg.clear)list.push({v:'',label:cfg.clear,clear:true});
    cfg.options.forEach(o=>{if(t.every(w=>norm(o.label+' '+(o.sub||'')).includes(w)))list.push(o)});
    p.list=list;
    const real=list.filter(o=>!o.clear);
    $('#opts').innerHTML=(real.length||cfg.clear?list.map((o,i)=>{const sel=o.v===cfg.value;
      return '<button type="button" class="opt'+(o.clear?' muted':'')+'" role="option" aria-selected="'+(sel?'true':'false')+'" data-act="opt" data-i="'+i+'"><span class="grow"><b>'+esc(o.label)+'</b>'+(o.sub?'<span>'+esc(o.sub)+'</span>':'')+'</span>'+(sel?ic('check','ok'):'')+'</button>'}).join(''):'')
      +(real.length?'':'<p class="opts-empty">'+esc(p.q?'Aucun résultat pour « '+p.q+' ».':(cfg.empty||'Aucune option disponible.'))+'</p>');
  };
  p.draw();
}
function confirmDiscard(){
  openSheet('<div class="confirm"><div class="sheet-head"><h2>Abandonner la saisie ?</h2></div><p>Les informations saisies ne seront pas enregistrées.</p><div class="btnrow"><button type="button" class="btn ghost" data-act="closeSheet">Continuer la saisie</button><button type="button" class="btn danger" data-act="discard">Abandonner</button></div></div>','Abandonner la saisie');
}

function communeOptions(){const o=[];Object.keys(GEO).forEach(w=>GEO[w].forEach(c=>o.push({v:w+'|'+c,label:c,sub:'Wilaya de '+w})));return o}
function sectorErrors(f,e){
  const er={},n=f.name.trim();
  if(!n)er.name='Saisissez le nom du secteur.';
  if(!f.commune)er.commune='Sélectionnez une commune.';
  else if(n){
    const dup=db.sectors.some(s=>s.id!==e.params.id&&s.wilaya===f.wilaya&&s.commune===f.commune&&norm(s.name)===norm(n));
    if(dup)er.name='Un secteur « '+n+' » existe déjà dans la commune de '+f.commune+'.';
  }
  return er;
}
screens.secteurForm={
  title:e=>e.params.id?'Modifier le secteur':'Nouveau secteur',
  init(e){
    if(e.form)return;
    const s=e.params.id?sec(e.params.id):null;
    e.form=s?{name:s.name,wilaya:s.wilaya,commune:s.commune,description:s.description||''}:{name:'',wilaya:'',commune:'',description:''};
    e.form0=snapshot(e.form);
  },
  body(e){
    screens.secteurForm.init(e);
    const f=e.form,edit=!!e.params.id,lock=edit&&db.quartiers.some(q=>q.sectorId===e.params.id);
    const sug=f.commune&&!f.name.trim()?'<button type="button" class="suggest" data-act="suggest">'+ic('plus','xs')+'Suggestion : '+esc(f.commune)+'</button>':'';
    return fText({key:'name',bind:'name',label:'Nom du secteur',req:true,value:f.name,ph:'Ex: Centre-ville',strong:true,help:'Nom libre, indépendant des noms de quartiers.',extra:sug})
      +fPick({key:'commune',label:'Commune',req:true,strong:true,value:f.commune?f.commune+' · Wilaya de '+f.wilaya:'',ph:'Sélectionner une commune',disabled:lock,
        help:lock?'La commune ne peut pas être modifiée tant que le secteur contient des quartiers.':''})
      +fText({key:'description',bind:'description',label:'Description (optionnel)',area:true,value:f.description,ph:'Ex: Zone résidentielle au nord de la ville'});
  },
  footer:()=> '<button type="button" class="btn" data-act="save">Enregistrer</button>',
  dirty:dirtyFn,
  validateKey(e,k){setErr(k,sectorErrors(e.form,e)[k]||'')},
  save(e){
    const f=e.form;
    if(!showErrors(sectorErrors(f,e),['name','commune']))return;
    const name=f.name.trim().replace(/\s+/g,' ');
    if(e.params.id){
      Object.assign(sec(e.params.id),{name,wilaya:f.wilaya,commune:f.commune,description:f.description.trim()});
      snack('Secteur modifié');pop();
    }else{
      const s={id:uid('s'),name,wilaya:f.wilaya,commune:f.commune,description:f.description.trim()};
      db.sectors.push(s);
      S.stack.pop();const prev=top();
      if(prev&&prev.name==='secteurs'){prev.ui.q='';prev.ui.filter='all';prev.flash=s.id}
      snack('Secteur « '+name+' » créé');render('back');
    }
  },
  pick(e,key){
    if(key!=='commune')return;
    openPicker({title:'Commune',search:true,options:communeOptions(),value:e.form.wilaya+'|'+e.form.commune,
      onPick(v){const[w,c]=v.split('|');e.form.wilaya=w;e.form.commune=c;renderKeep();if(e.form.name.trim())screens.secteurForm.validateKey(e,'name')}});
  }
};

/* Client — formulaire */
function clientErrors(f){
  const er={};
  if(!f.name.trim())er.name='Saisissez le nom du client.';
  const digits=f.phone.replace(/\D/g,'');
  if(f.phone.trim()&&(digits.length<9||digits.length>10))er.phone='Numéro invalide. Exemple : 0555 12 34 56.';
  const num=v=>v.trim()!==''&&!isNaN(Number(v.replace(',','.')));
  if(f.lat.trim()&&(!num(f.lat)||Math.abs(Number(f.lat.replace(',','.')))>90))er.lat='Latitude invalide (entre −90 et 90).';
  if(f.lng.trim()&&(!num(f.lng)||Math.abs(Number(f.lng.replace(',','.')))>180))er.lng='Longitude invalide (entre −180 et 180).';
  if(!er.lat&&!er.lng){if(f.lat.trim()&&!f.lng.trim())er.lng='Renseignez aussi la longitude.';if(f.lng.trim()&&!f.lat.trim())er.lat='Renseignez aussi la latitude.'}
  return er;
}

}

/* Appui long sur le nom (barre du haut) → formulaire de modification */
const LONG_MS=550;
let lp=null,swallowUntil=0;
function lpClear(){if(lp){clearTimeout(lp.t);lp.el.classList.remove('pressing');lp=null}}
function lpFire(){
  if(!lp)return;
  const el=lp.el;clearTimeout(lp.t);el.classList.remove('pressing');lp=null;
  swallowUntil=Date.now()+600;
  acts.editTitle(el);
}
document.addEventListener('pointerdown',ev=>{
  swallowUntil=0;
  const el=ev.target.closest&&ev.target.closest('[data-longpress]');
  if(!el||(ev.button&&ev.button!==0))return;
  lpClear();
  lp={el,x:ev.clientX,y:ev.clientY,t:setTimeout(lpFire,LONG_MS)};
  el.classList.add('pressing');
});
document.addEventListener('pointermove',ev=>{if(lp&&Math.hypot((ev.clientX||0)-lp.x,(ev.clientY||0)-lp.y)>12)lpClear()});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,lpClear));
document.addEventListener('contextmenu',ev=>{
  const el=ev.target.closest&&ev.target.closest('[data-longpress]');
  if(!el)return;
  ev.preventDefault();
  if(lp&&lp.el===el)lpFire();
});
document.addEventListener('click',ev=>{
  if(Date.now()<swallowUntil){ev.stopPropagation();ev.preventDefault();return}
  const el=ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  if(el.dataset.act!=='scenario'&&S.hint){S.hint=null;applyHint()}
  const fn=acts[el.dataset.act];if(fn)fn(el,ev);
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='sheet-q'&&S.picker){S.picker.q=t.value;S.picker.draw();return}
  if(t.matches&&t.matches('[data-search]')){
    const e=top();e.ui.q=t.value;const c=$('.clear');if(c)c.hidden=!t.value;
    screens[e.name].refresh(e);return;
  }
  if(t.dataset&&t.dataset.bind){
    const e=top(),path=t.dataset.bind.split('.');let o=e.form;
    for(let i=0;i<path.length-1;i++)o=o[path[i]];
    o[path[path.length-1]]=t.value;
    const key=t.id.replace(/^f-/,'');
    const p=$('#e-'+key);if(p&&!p.hidden)setErr(key,'');
  }
});
document.addEventListener('focusout',ev=>{
  const t=ev.target;
  if(!t.dataset||!t.dataset.bind)return;
  const e=top(),def=screens[e.name],key=t.id.replace(/^f-/,'');
  if(def.validateKey&&(key==='name'||key==='phone'||key==='lat'||key==='lng'))def.validateKey(e,key);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&S.sheet){closeSheet();return}
  const t=ev.target;
  if(t&&t.matches&&t.matches('[data-longpress]')&&(ev.key==='F2'||((ev.key==='Enter'||ev.key===' ')&&ev.repeat))){ev.preventDefault();swallowUntil=Date.now()+600;acts.editTitle(t)}
});

/* Panel: open on wide screens, collapsed on phones */
const panel=$('#panel');
if(window.matchMedia&&window.matchMedia('(max-width:719px)').matches)panel.removeAttribute('open');

window.__distrigo={S,get db(){return db},acts,screens};
S.stack=[mk('home'),mk('secteurs')];
render();
})();
</script>
