# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# ── JVM memory ───────────────────────────────────────────────────────────────
#
# Sized for the machine this is built on: 7.75 GB of RAM, shared with Android Studio (~2 GB) and
# the OS. The previous values asked for 4 GB (Gradle) + 2 GB (Kotlin) = 6 GB of Java heap, which
# does not fit alongside that, and the builds said so:
#
#   There is insufficient memory for the Java Runtime Environment to continue.
#   Native memory allocation (mmap) failed to map 341835776 bytes for G1 virtual space
#
# Note what that is *not*: it is not "OutOfMemoryError: Java heap space". It is the JVM failing to
# reserve the heap it was told to take, because the system had no memory left to commit. Raising
# -Xmx makes that failure arrive sooner, not later — the fix is to ask for less.
#
# MaxMetaspaceSize is capped because a long-lived Gradle daemon accumulates class metadata across
# builds, and metaspace is unbounded by default: without a ceiling it grows until it is competing
# with the heap it sits beside. HeapDumpOnOutOfMemoryError is there so that a *genuine* heap
# exhaustion leaves something to read, rather than another native-reservation dump that says
# nothing about which allocation actually overflowed.
#
# The saving comes out of the Gradle daemon, not the Kotlin one. On a single-module project the
# Gradle daemon mostly orchestrates — it was observed at 1.6 GB during a full build — while the
# Kotlin compiler is the part that actually needs room.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Left at its original 2 GB, deliberately. An attempt to cut this to 1 GB failed outright:
#
#   e: org.jetbrains.kotlin.codegen.CompilationException: Back-end (JVM) Internal error
#   Caused by: java.lang.OutOfMemoryError: Java heap space
#     at org.jetbrains.org.objectweb.asm.tree.analysis.Frame.<init>
#
# Compose's IR lowering and the ASM frame analysis behind it are the memory-hungry part of this
# build, and starving them does not save memory — it spends fifteen minutes thrashing the collector
# and then dies. This value was never what was wrong.
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m

# Gradle defaults this to the CPU count — 8 here — and each worker can be its own process. On a
# machine with this much RAM that is a way to run out of it, not a way to go faster.
org.gradle.workers.max=3

# Work not done costs no memory. The build cache is the cheapest win available here.
org.gradle.caching=true

# The daemon otherwise sits for three hours holding its whole heap. Half an hour is long enough to
# keep consecutive builds warm without squatting on 2.5 GB for the rest of the day.
org.gradle.daemon.idletimeout=1800000
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true